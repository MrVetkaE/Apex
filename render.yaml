services:
  - type: web
    name: apex-nutrition-store
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn apex_project.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apex-postgres-db
          property: connectionString

databases:
  - name: apex-postgres-db
    databaseName: apexdb
    user: apexuser
    plan: free
