services:
  db:
    image: postgres:16-alpine
    container_name: apex_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexdb}
      POSTGRES_USER: ${POSTGRES_USER:-apexuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexsecretpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexuser} -d ${POSTGRES_DB:-apexdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: apex_web
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: apex_project.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme-production-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-apexdb}
      POSTGRES_USER: ${POSTGRES_USER:-apexuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexsecretpass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python populate_db.py &&
             gunicorn apex_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:alpine
    container_name: apex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    container_name: apex_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  postgres_data:
  media_data:
  certbot_certs:
  certbot_data:
